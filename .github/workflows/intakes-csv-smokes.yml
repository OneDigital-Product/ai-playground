name: Intakes and CSV Smokes

on:
  # Allow manual runs when permitted
  workflow_dispatch: {}
  # Run on any branch push so feature branches trigger CI
  push:
    branches: [ "**" ]
  # Also run on PRs targeting main
  pull_request:
    branches: [ main ]

jobs:
  smokes:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex and export URL (when deploy key present)
        if: ${{ env.NEXT_PUBLIC_CONVEX_URL == '' && secrets.CONVEX_DEPLOY_KEY != '' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          pnpm --filter @repo/backend exec npx convex deploy \
            --cmd "bash -lc 'echo NEXT_PUBLIC_CONVEX_URL=$NEXT_PUBLIC_CONVEX_URL >> $GITHUB_ENV'" \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      - name: Run Intakes smoke (SDK)
        if: ${{ env.NEXT_PUBLIC_CONVEX_URL != '' }}
        run: pnpm smoke:intakes

      - name: Run CSV/Uploads smoke (HTTP)
        if: ${{ env.NEXT_PUBLIC_CONVEX_URL != '' }}
        run: pnpm smoke:csv

      - name: Skip notice (missing NEXT_PUBLIC_CONVEX_URL and no deploy key)
        if: ${{ env.NEXT_PUBLIC_CONVEX_URL == '' && secrets.CONVEX_DEPLOY_KEY == '' }}
        run: echo "Skipping smokes - NEXT_PUBLIC_CONVEX_URL not set and CONVEX_DEPLOY_KEY not provided"